<div class="welcome-banner-wrapper">
  <div class="welcome-text-col">
    <h1 class="welcome-title">
      Welcome back, {{ greetingName }}! <span class="wave-emoji" aria-hidden="true">👋</span>
    </h1>
    <p class="welcome-subtitle">
      Here's what's happening with your EventFlow bookings.
    </p>
  </div>

  <div class="welcome-action-col">
    <a routerLink="/events" class="discover-btn">
      <svg class="discover-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
      </svg>
      <span>Discover Events</span>
    </a>
  </div>
</div>
