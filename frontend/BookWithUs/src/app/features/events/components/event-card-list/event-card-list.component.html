<div class="event-card-list-container">
  @if (loading) {
    <!-- Loading State -->
    <div class="loading-state" role="status" aria-live="polite">
      <div class="spinner"></div>
      <span class="loading-text">Loading events...</span>
    </div>
  } @else if (events.length === 0) {
    <!-- Empty State -->
    <div class="empty-state" role="status">
      <div class="empty-icon-circle">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </div>
      <h3 class="empty-title">No events match your current filters.</h3>
      <p class="empty-subtitle">
        Try adjusting your search terms, date, venue, or category to find upcoming events.
      </p>
    </div>
  } @else {
    <!-- Events Grid -->
    <div class="events-grid" role="region" aria-label="Events list">
      @for (event of events; track event.id) {
        <app-event-card
          [event]="event"
          (viewEvent)="onViewEvent($event)"
        ></app-event-card>
      }
    </div>
  }
</div>
