<aside class="parking-event-summary-card" aria-label="Event Details">
  @if (hasEvent) {
    <header class="event-summary-header">
      @if (categoryDisplay) {
        <span class="event-category-badge">{{ categoryDisplay }}</span>
      }
      <h2 class="event-title">{{ eventTitle }}</h2>
    </header>

    <div class="event-meta-list">
      @if (venueDisplay) {
        <div class="event-meta-item">
          <svg xmlns="http://www.w3.org/2000/svg" class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <span class="meta-text">{{ venueDisplay }}</span>
        </div>
      }

      @if (dateDisplay) {
        <div class="event-meta-item">
          <svg xmlns="http://www.w3.org/2000/svg" class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span class="meta-text">{{ dateDisplay }}</span>
        </div>
      }

      @if (timeDisplay) {
        <div class="event-meta-item">
          <svg xmlns="http://www.w3.org/2000/svg" class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span class="meta-text">{{ timeDisplay }}</span>
        </div>
      }
    </div>
  } @else {
    <div class="event-summary-empty">
      <p class="empty-text">Event details unavailable.</p>
    </div>
  }
</aside>
