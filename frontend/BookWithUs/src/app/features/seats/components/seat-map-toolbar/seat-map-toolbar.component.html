<div class="seat-map-toolbar" role="toolbar" aria-label="Seat map navigation controls">
  <!-- Reset Button -->
  <button
    type="button"
    class="toolbar-btn"
    [disabled]="!canReset"
    (click)="onReset()"
    aria-label="Reset seat map view"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="toolbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
      <path d="M3 3v5h5"></path>
    </svg>
    <span class="toolbar-label">Reset</span>
  </button>

  <!-- Zoom In Button -->
  <button
    type="button"
    class="toolbar-btn"
    [disabled]="!canZoomIn"
    (click)="onZoomIn()"
    aria-label="Zoom in on seat map"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="toolbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      <line x1="11" y1="8" x2="11" y2="14"></line>
      <line x1="8" y1="11" x2="14" y2="11"></line>
    </svg>
    <span class="toolbar-label">Zoom In</span>
  </button>

  <!-- Zoom Out Button -->
  <button
    type="button"
    class="toolbar-btn"
    [disabled]="!canZoomOut"
    (click)="onZoomOut()"
    aria-label="Zoom out on seat map"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="toolbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      <line x1="8" y1="11" x2="14" y2="11"></line>
    </svg>
    <span class="toolbar-label">Zoom Out</span>
  </button>

  <!-- Fit Button -->
  <button
    type="button"
    class="toolbar-btn"
    (click)="onFit()"
    aria-label="Fit seat map to screen"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="toolbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
      <path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
      <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
      <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
    </svg>
    <span class="toolbar-label">Fit</span>
  </button>
</div>
