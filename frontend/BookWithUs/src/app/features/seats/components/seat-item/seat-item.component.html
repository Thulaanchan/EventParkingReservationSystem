@if (seat) {
  <button
    type="button"
    class="seat-item-btn"
    [appSeatStatus]="seat.status"
    [class.seat-selected]="selected"
    [class.seat-vip]="isVip"
    [disabled]="!isSelectable"
    [attr.aria-label]="accessibleLabel"
    [attr.aria-selected]="selected"
    [attr.aria-disabled]="!isSelectable"
    [attr.data-seat-id]="seat.id"
    [attr.data-seat-code]="seat.seatCode"
    [attr.data-selected]="selected"
    [title]="tooltipText"
    (click)="onSeatClick($event)"
  >
    @if (isVip) {
      <span class="seat-vip-star" aria-hidden="true">&#9733;</span>
    } @else if (selected && selectedIndex != null) {
      <span class="seat-badge-number" aria-hidden="true">{{ selectedIndex }}</span>
    } @else {
      <span class="seat-number" aria-hidden="true">{{ seat.number != null ? seat.number : (seat | seatLabel) }}</span>
    }
    <span class="sr-only">{{ seat | seatLabel }}</span>
  </button>
}
