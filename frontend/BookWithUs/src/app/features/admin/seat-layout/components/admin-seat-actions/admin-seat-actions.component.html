<div class="seat-actions-wrapper">
  <!-- Left Floating Canvas Toolbar -->
  <div class="canvas-floating-toolbar" role="toolbar" aria-label="Seat map view controls">
    <!-- Reset View -->
    <button
      type="button"
      class="toolbar-btn"
      (click)="onResetView()"
      [disabled]="disabled"
      aria-label="Reset view">
      <svg class="toolbar-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
        <path d="M3 3v5h5"></path>
      </svg>
      <span class="toolbar-label">Reset View</span>
    </button>

    <!-- Zoom In -->
    <button
      type="button"
      class="toolbar-btn"
      (click)="onZoomIn()"
      [disabled]="disabled"
      aria-label="Zoom in">
      <svg class="toolbar-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        <line x1="11" y1="8" x2="11" y2="14"></line>
        <line x1="8" y1="11" x2="14" y2="11"></line>
      </svg>
      <span class="toolbar-label">Zoom In</span>
    </button>

    <!-- Zoom Percentage Display -->
    <div class="zoom-badge" aria-label="Current zoom level" title="Current zoom level">
      {{ clampedZoomPercent }}%
    </div>

    <!-- Zoom Out -->
    <button
      type="button"
      class="toolbar-btn"
      (click)="onZoomOut()"
      [disabled]="disabled"
      aria-label="Zoom out">
      <svg class="toolbar-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        <line x1="8" y1="11" x2="14" y2="11"></line>
      </svg>
      <span class="toolbar-label">Zoom Out</span>
    </button>

    <!-- Fit to Screen -->
    <button
      type="button"
      class="toolbar-btn"
      (click)="onFitToScreen()"
      [disabled]="disabled"
      aria-label="Fit to screen">
      <svg class="toolbar-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
        <path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
        <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
        <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
      </svg>
      <span class="toolbar-label">Fit to Screen</span>
    </button>

    <!-- Seat List Toggle -->
    <button
      type="button"
      class="toolbar-btn"
      [class.active]="seatListOpen"
      (click)="onToggleSeatList()"
      [disabled]="disabled"
      [attr.aria-pressed]="seatListOpen"
      [attr.aria-label]="seatListOpen ? 'Hide Seat List' : 'Show Seat List'">
      <svg class="toolbar-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
      <span class="toolbar-label">{{ seatListOpen ? 'Hide Seat List' : 'Seat List' }}</span>
    </button>
  </div>

  <!-- Bottom Action: Refresh Seat Status -->
  <div class="bottom-action-bar">
    <button
      type="button"
      class="btn-refresh-status"
      (click)="onRefreshStatuses()"
      [disabled]="disabled || refreshing"
      [attr.aria-label]="refreshing ? 'Refreshing seat status...' : 'Refresh seat status'">
      <svg
        class="refresh-svg"
        [class.spinning]="refreshing"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
      </svg>
      <span>{{ refreshing ? 'Refreshing...' : 'Refresh Seat Status' }}</span>
    </button>
  </div>
</div>
