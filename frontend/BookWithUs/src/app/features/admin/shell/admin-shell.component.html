<div class="admin-layout" [class.sidebar-collapsed]="isSidebarCollapsed">
  <!-- Left Sidebar -->
  <aside class="admin-sidebar" aria-label="Admin Navigation Sidebar">
    <!-- Brand Header -->
    <div class="sidebar-header">
      <button
        type="button"
        class="btn-hamburger"
        (click)="toggleSidebar()"
        aria-label="Toggle navigation menu">
        <svg class="hamburger-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <a routerLink="/admin/dashboard" class="brand-logo" aria-label="BookWithUs Admin Home">
        <span class="brand-text">BookWithUs</span>
      </a>
    </div>

    <!-- Navigation Menu Items -->
    <nav class="sidebar-nav">
      <!-- Main Nav -->
      <ul class="nav-list">
        <li class="nav-item">
          <a
            routerLink="/admin/dashboard"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link"
            aria-label="Dashboard">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span class="nav-label">Dashboard</span>
          </a>
        </li>

        <li class="nav-item">
          <a
            routerLink="/admin/customers"
            routerLinkActive="active"
            class="nav-link"
            aria-label="Customers">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span class="nav-label">Customers</span>
          </a>
        </li>

        <li class="nav-item">
          <a
            routerLink="/admin/venues"
            routerLinkActive="active"
            class="nav-link"
            aria-label="Venues">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path>
              <path d="M6 12H4a2 2 0 0 0-2 2v8h4"></path>
              <path d="M18 9h2a2 2 0 0 1 2 2v11h-4"></path>
              <path d="M10 6h4"></path>
              <path d="M10 10h4"></path>
              <path d="M10 14h4"></path>
              <path d="M10 18h4"></path>
            </svg>
            <span class="nav-label">Venues</span>
          </a>
        </li>

        <li class="nav-item">
          <a
            routerLink="/admin/categories"
            routerLinkActive="active"
            class="nav-link"
            aria-label="Categories">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
              <line x1="7" y1="7" x2="7.01" y2="7"></line>
            </svg>
            <span class="nav-label">Categories</span>
          </a>
        </li>

        <li class="nav-item">
          <a
            routerLink="/admin/events"
            routerLinkActive="active"
            class="nav-link"
            aria-label="Events">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span class="nav-label">Events</span>
          </a>
        </li>
      </ul>

      <!-- Section Label: RESERVATIONS -->
      <div class="nav-section-divider">
        <span class="nav-section-title">RESERVATIONS</span>
      </div>

      <ul class="nav-list">
        <li class="nav-item">
          <a
            routerLink="/admin/bookings"
            routerLinkActive="active"
            class="nav-link"
            aria-label="Bookings">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path>
              <line x1="9" y1="12" x2="15" y2="12"></line>
            </svg>
            <span class="nav-label">Bookings</span>
          </a>
        </li>

        <li class="nav-item">
          <a
            routerLink="/admin/payments"
            routerLinkActive="active"
            class="nav-link"
            aria-label="Payments">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="5" width="20" height="14" rx="2"></rect>
              <line x1="2" y1="10" x2="22" y2="10"></line>
            </svg>
            <span class="nav-label">Payments</span>
          </a>
        </li>

        <li class="nav-item">
          <button
            type="button"
            class="nav-link nav-link-button"
            (click)="onLogout()"
            aria-label="Logout">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span class="nav-label">Logout</span>
          </button>
        </li>
      </ul>
    </nav>

    <!-- Bottom Help Box -->
    <div class="sidebar-help-card">
      <div class="help-icon-circle" aria-hidden="true">
        <svg class="help-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
          <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
        </svg>
      </div>
      <div class="help-text-group">
        <span class="help-title">Need Help?</span>
        <a href="mailto:support@bookwithus.com" class="help-link">Contact Support ›</a>
      </div>
    </div>
  </aside>

  <!-- Right Content Wrapper -->
  <div class="admin-main-wrapper">
    <!-- Top Bar -->
    <header class="admin-topbar" aria-label="Admin Top Bar">
      <div class="topbar-left">
        <!-- Spacer / Search placeholder if needed -->
      </div>

      <div class="topbar-right">
        <!-- Notifications Bell -->
        <button type="button" class="btn-notification" aria-label="Notifications (3 unread)">
          <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="notification-badge">3</span>
        </button>

        <!-- User Profile -->
        <div class="user-profile-menu">
          <div class="user-avatar" aria-hidden="true">
            {{ adminInitials }}
          </div>
          <span class="user-name">{{ adminName }}</span>
          <svg class="chevron-down-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
          </svg>
        </div>
      </div>
    </header>

    <!-- Routed Page Content -->
    <div class="admin-page-body">
      <router-outlet></router-outlet>
    </div>

    <!-- Admin Footer -->
    <footer class="admin-footer" aria-label="Footer">
      <div class="footer-left">
        <span>© 2026 BookWithUs Inc. All rights reserved.</span>
      </div>
      <div class="footer-right">
        <a href="#privacy" class="footer-link">Privacy Policy</a>
        <a href="#terms" class="footer-link">Terms of Service</a>
        <a href="#support" class="footer-link">Support</a>
      </div>
    </footer>
  </div>
</div>
