<div class="category-stats-grid">
  <!-- Card 1: Total Categories -->
  <div class="stat-card">
    <div class="stat-icon-wrapper">
      <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
        <line x1="7" y1="7" x2="7.01" y2="7"></line>
      </svg>
    </div>
    <div class="stat-details">
      <span class="stat-title">TOTAL CATEGORIES</span>
      <span class="stat-value">{{ totalCategories }}</span>
      <span class="stat-description">Available for event creation</span>
    </div>
  </div>

  <!-- Card 2: Categories In Use -->
  <div class="stat-card">
    <div class="stat-icon-wrapper">
      <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
    </div>
    <div class="stat-details">
      <span class="stat-title">CATEGORIES IN USE</span>
      <span class="stat-value">{{ categoriesInUse }}</span>
      <span class="stat-description">Assigned to existing events</span>
    </div>
  </div>
</div>
