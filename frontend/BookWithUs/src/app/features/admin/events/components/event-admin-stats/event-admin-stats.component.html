<div class="event-stats-grid">
  <!-- Card 1: Total Events -->
  <div class="stat-card">
    <div class="stat-icon-wrapper">
      <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
    </div>
    <div class="stat-details">
      <span class="stat-title">TOTAL EVENTS</span>
      <span class="stat-value">{{ totalEvents | number }}</span>
      <span class="stat-description">{{ upcomingEvents | number }} upcoming events</span>
    </div>
  </div>

  <!-- Card 2: Upcoming Events -->
  <div class="stat-card">
    <div class="stat-icon-wrapper">
      <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
        <polyline points="9 16 11 18 15 14"></polyline>
      </svg>
    </div>
    <div class="stat-details">
      <span class="stat-title">UPCOMING EVENTS</span>
      <span class="stat-value">{{ upcomingEvents | number }}</span>
      <span class="stat-description">Available for booking</span>
    </div>
  </div>

  <!-- Card 3: Total Bookings -->
  <div class="stat-card">
    <div class="stat-icon-wrapper">
      <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 9a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9Z"></path>
        <path d="M13 5v2"></path>
        <path d="M13 17v2"></path>
        <path d="M13 11v2"></path>
      </svg>
    </div>
    <div class="stat-details">
      <span class="stat-title">TOTAL BOOKINGS</span>
      <span class="stat-value">{{ totalBookings | number }}</span>
      <span class="stat-description">Across all events</span>
    </div>
  </div>
</div>
