<div class="venue-stats-grid">
  <!-- Card 1: Total Venues -->
  <div class="stat-card">
    <div class="stat-icon-wrapper">
      <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
    </div>
    <div class="stat-details">
      <span class="stat-title">TOTAL VENUES</span>
      <span class="stat-value">{{ totalVenues }}</span>
      <span class="stat-description">Registered venues</span>
    </div>
  </div>

  <!-- Card 2: Upcoming Events -->
  <div class="stat-card">
    <div class="stat-icon-wrapper">
      <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
    </div>
    <div class="stat-details">
      <span class="stat-title">UPCOMING EVENTS</span>
      <span class="stat-value">{{ upcomingEvents }}</span>
      <span class="stat-description">Across all venues</span>
    </div>
  </div>

  <!-- Card 3: Total Venue Capacity -->
  <div class="stat-card">
    <div class="stat-icon-wrapper">
      <svg class="stat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
    </div>
    <div class="stat-details">
      <span class="stat-title">TOTAL VENUE CAPACITY</span>
      <span class="stat-value">{{ totalCapacity | number }}</span>
      <span class="stat-description">Combined seating capacity</span>
    </div>
  </div>
</div>
