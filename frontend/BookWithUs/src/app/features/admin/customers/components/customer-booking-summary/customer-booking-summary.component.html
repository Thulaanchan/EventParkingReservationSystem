<div class="booking-summary-card">
  <div class="summary-header">
    <div class="icon-wrap">
      <svg class="summary-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
    </div>
    <div class="title-wrap">
      <h4 class="summary-title">Booking Activity</h4>
      <span class="summary-subtitle">Total event bookings recorded</span>
    </div>
  </div>

  <div class="summary-stat-row">
    <div class="stat-col">
      <span class="stat-num">{{ bookingCount() }}</span>
      <span class="stat-desc">Reservations Created</span>
    </div>

    <div class="status-col">
      @if (bookingCount() > 0) {
        <span class="status-pill active-pill">Active Booker</span>
      } @else {
        <span class="status-pill neutral-pill">No Bookings Yet</span>
      }
    </div>
  </div>
</div>
