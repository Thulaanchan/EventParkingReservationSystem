<div class="filter-toolbar">
  <!-- Search Input Container -->
  <div class="search-input-wrap">
    <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
    </svg>

    <input
      type="text"
      class="search-input"
      placeholder="Search by customer name or email..."
      [formControl]="searchControl"
      (input)="onInput($event)"
      aria-label="Search customers by name or email"
    />

    @if (searchControl.value) {
      <button
        type="button"
        class="clear-search-btn"
        (click)="onClearSearch()"
        aria-label="Clear search input"
      >
        <svg viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      </button>
    }

    @if (isLoading) {
      <span class="search-spinner" aria-hidden="true"></span>
    }
  </div>

  <!-- Status Filter Tabs -->
  <div class="filter-tabs" role="tablist" aria-label="Customer Status Filter">
    <button
      type="button"
      role="tab"
      class="tab-btn"
      [class.active]="activeFilter() === 'ALL'"
      [attr.aria-selected]="activeFilter() === 'ALL'"
      (click)="onSelectFilter('ALL')"
    >
      All Customers
    </button>
    <button
      type="button"
      role="tab"
      class="tab-btn"
      [class.active]="activeFilter() === 'ACTIVE'"
      [attr.aria-selected]="activeFilter() === 'ACTIVE'"
      (click)="onSelectFilter('ACTIVE')"
    >
      Active
    </button>
    <button
      type="button"
      role="tab"
      class="tab-btn"
      [class.active]="activeFilter() === 'INACTIVE'"
      [attr.aria-selected]="activeFilter() === 'INACTIVE'"
      (click)="onSelectFilter('INACTIVE')"
    >
      Inactive
    </button>
  </div>
</div>
