<div class="profile-page-container">
  <!-- Page Header & Notification Row (screen-17) -->
  <div class="profile-header-row">
    <div class="header-titles">
      <h1 class="page-title">Profile</h1>
      <p class="page-subtitle">
        Manage your personal information and account details.
      </p>
    </div>

    <!-- Success Toast (screen-17 top-right) -->
    @if (successMessage()) {
      <div class="success-toast" role="status" aria-live="polite">
        <div class="toast-left">
          <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
          <span class="toast-text">{{ successMessage() }}</span>
        </div>
        <button
          type="button"
          class="toast-close-btn"
          (click)="dismissSuccessMessage()"
          aria-label="Dismiss success message"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    }
  </div>

  <!-- Page Error Alert -->
  @if (pageErrorMessage()) {
    <div class="alert alert-error" role="alert" aria-live="polite">
      <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <div class="alert-content">
        <span class="alert-title">Unable to Load Profile</span>
        <span class="alert-message">{{ pageErrorMessage() }}</span>
      </div>
      <button type="button" class="retry-btn" (click)="retryLoad()">
        Retry
      </button>
    </div>
  }

  <!-- Loading State -->
  @if (isLoading()) {
    <div class="loading-state" aria-busy="true" aria-label="Loading profile">
      <div class="page-spinner"></div>
      <p class="loading-text">Loading your profile details...</p>
    </div>
  } @else if (customer()) {
    <!-- Main Content Grid (screen-17) -->
    <div class="profile-grid">
      <!-- Left Column: Summary & Overview -->
      <aside class="profile-left-col">
        <app-profile-summary-card
          [customer]="customer()"
          [isLoading]="isLoading()"
        ></app-profile-summary-card>
      </aside>

      <!-- Right Column: Personal Information & Account Security -->
      <section class="profile-right-col">
        <app-personal-information-form
          [customer]="customer()"
          [isSaving]="isSaving()"
          [errorMessage]="formErrorMessage()"
          (update)="onUpdateProfile($event)"
        ></app-personal-information-form>

        <app-account-security-card
          [email]="customer()?.email ?? null"
        ></app-account-security-card>
      </section>
    </div>
  }
</div>
