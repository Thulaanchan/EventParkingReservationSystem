<div class="event-summary-card" *ngIf="event">
  <div class="card-header">
    <h3 class="card-title">Event Details</h3>
    <span *ngIf="event.categoryName" class="category-badge">
      {{ event.categoryName }}
    </span>
  </div>

  <div class="event-body">
    <div class="poster-container">
      <img
        [src]="event.posterUrl || fallbackPosterUrl"
        [alt]="event.eventName"
        class="event-poster"
        (error)="onImageError($event)"
      />
    </div>

    <div class="event-content">
      <h4 class="event-name">{{ event.eventName }}</h4>

      <p *ngIf="event.description" class="event-description">
        {{ event.description }}
      </p>

      <div class="meta-grid">
        <div class="meta-item" *ngIf="event.venueName">
          <svg class="meta-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
          </svg>
          <div class="meta-text">
            <span class="meta-label">Venue</span>
            <span class="meta-value">{{ event.venueName }}</span>
          </div>
        </div>

        <div class="meta-item" *ngIf="event.eventDate">
          <svg class="meta-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd" />
          </svg>
          <div class="meta-text">
            <span class="meta-label">Date</span>
            <span class="meta-value">{{ event.eventDate }}</span>
          </div>
        </div>

        <div class="meta-item" *ngIf="event.startTime">
          <svg class="meta-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd" />
          </svg>
          <div class="meta-text">
            <span class="meta-label">Time</span>
            <span class="meta-value">
              {{ event.startTime }}<span *ngIf="event.endTime"> - {{ event.endTime }}</span>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
