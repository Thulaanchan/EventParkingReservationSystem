<div
  class="alert-banner"
  [class.alert-info]="variant === 'info'"
  [class.alert-success]="variant === 'success'"
  [class.alert-warning]="variant === 'warning'"
  [class.alert-error]="variant === 'error'"
  [attr.role]="roleAttribute"
>
  <div class="alert-icon-wrapper" aria-hidden="true">
    @switch (variant) {
      @case ('success') {
        <svg xmlns="http://www.w3.org/2000/svg" class="alert-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      }
      @case ('warning') {
        <svg xmlns="http://www.w3.org/2000/svg" class="alert-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      }
      @case ('error') {
        <svg xmlns="http://www.w3.org/2000/svg" class="alert-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      }
      @default {
        <svg xmlns="http://www.w3.org/2000/svg" class="alert-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
      }
    }
  </div>

  <div class="alert-content">
    @if (title) {
      <strong class="alert-title">{{ title }}</strong>
    }
    <span class="alert-message">{{ message }}</span>
  </div>

  @if (dismissible) {
    <button
      type="button"
      class="alert-dismiss-btn"
      aria-label="Dismiss alert"
      (click)="onDismiss()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="dismiss-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  }
</div>
